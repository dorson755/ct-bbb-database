openapi: 3.0.0
info:
  title: CT BBB Dashboard API
  version: 1.0.0
  description: API for BBB and Moodle integration
servers:
  - url: https://ct-bbb-dashboard-256f58650ed0.herokuapp.com
    description: Production server

paths:
  /api/health:
    get:
      tags: [System]
      summary: Server health check
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  dbStatus:
                    type: string
                  uptime:
                    type: number

  /api/getRecordings:
    get:
      tags: [BBB API]
      summary: Get BigBlueButton recordings
      parameters:
        - in: query
          name: meetingID
          schema:
            type: string
      responses:
        200:
          description: Recordings list
          content:
            application/xml:
              schema:
                type: string
        500:
          description: BBB API error

  /api/searchStudents:
    get:
      tags: [Moodle Integration]
      summary: Search Moodle students
      parameters:
        - in: query
          name: email
          schema:
            type: string
        - in: query
          name: fullName
          schema:
            type: string
      responses:
        200:
          description: Student list
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    fullname:
                      type: string
                    email:
                      type: string